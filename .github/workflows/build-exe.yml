name: Gerar .exe

on:
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    tags: ['v*']          # ao criar uma tag tipo v1.0.0, também publica numa Release

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar o .exe
        run: npx electron-builder --win portable --publish never

      - name: Guardar o .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: the-evil-house-exe
          path: dist/*.exe

      - name: Publicar numa Release (só quando for tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
